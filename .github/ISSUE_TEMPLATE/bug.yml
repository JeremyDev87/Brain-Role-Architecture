name: Bug report
description: Report a reproducible conformance or tooling defect
title: "[bug] "
labels: [bug]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Do not include credentials, private canon, profiles, sessions, or runtime state.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result and requirement ID
    validations:
      required: true
