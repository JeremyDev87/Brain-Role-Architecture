name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --all-groups --no-editable
      - run: make verify

  cli-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: "3.11"
      - run: uv sync --frozen --all-groups --no-editable
      - run: uv run --no-sync pytest -q tests/test_cli.py tests/test_compile.py tests/test_hermes_adapter.py
      - run: uv run --no-sync brain-role --version
      - run: uv build --no-sources --out-dir .artifacts/dist
      - run: uv run --no-sync python scripts/check_release_readiness.py
      - run: uv run --no-sync python scripts/smoke_distribution.py
