<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">Brain-Role Architecture overview</title>
  <desc id="desc">Three independent planes: Brain responsibility layers P0 through P6, Actor and Role capabilities, and an explicit compilation dependency graph. The neural runtime is orthogonal and cannot create authority. P numbers do not define execution or compile order.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 30px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #475569; }
      .plane { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 18; filter: url(#shadow); }
      .plane-title { font: 700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #0f172a; }
      .plane-subtitle { font: 400 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #64748b; }
      .node { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; rx: 10; }
      .node-title { font: 700 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #0f172a; }
      .node-text { font: 400 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #475569; }
      .p0 { fill: #fff1f2; stroke: #e11d48; stroke-width: 2; }
      .p0-title { font: 700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #9f1239; }
      .p0-text { font: 400 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #9f1239; }
      .neural { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; stroke-dasharray: 8 5; rx: 16; }
      .neural-title { font: 700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #1d4ed8; }
      .neural-text { font: 400 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #1e40af; }
      .dag { stroke: #2563eb; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .legend { font: 400 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #475569; }
      .legend-strong { font: 700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #0f172a; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="820"/>
  <text class="title" x="48" y="52">Brain-Role Architecture · independent planes</text>
  <text class="subtitle" x="48" y="82">Responsibility, capability, and compilation are explicit — authority never comes from execution order.</text>

  <rect class="neural" x="48" y="108" width="1184" height="94"/>
  <text class="neural-title" x="76" y="142">0.2.x Neural Runtime · orthogonal extension</text>
  <text class="neural-text" x="76" y="168">Neurons, synapses, receptors, homeostats, support, clocks, and proposals modulate execution only.</text>
  <text class="neural-text" x="760" y="142">No authority from activation, strength, concentration,</text>
  <text class="neural-text" x="760" y="168">receptor count, or graph centrality.</text>

  <rect class="plane" x="48" y="232" width="350" height="486"/>
  <text class="plane-title" x="76" y="270">Brain plane</text>
  <text class="plane-subtitle" x="76" y="292">responsibility · authority · change rules</text>

  <rect class="p0" x="76" y="314" width="294" height="58"/>
  <text class="p0-title" x="92" y="338">P0 · absolute invariant</text>
  <text class="p0-text" x="92" y="358">truth · safety · provenance · determinism</text>

  <rect class="node" x="76" y="388" width="140" height="48"/>
  <text class="node-title" x="92" y="409">P1</text><text class="node-text" x="92" y="426">automation</text>
  <rect class="node" x="230" y="388" width="140" height="48"/>
  <text class="node-title" x="246" y="409">P2</text><text class="node-text" x="246" y="426">durable state</text>
  <rect class="node" x="76" y="448" width="140" height="48"/>
  <text class="node-title" x="92" y="469">P3</text><text class="node-text" x="92" y="486">risk &amp; conflict</text>
  <rect class="node" x="230" y="448" width="140" height="48"/>
  <text class="node-title" x="246" y="469">P4</text><text class="node-text" x="246" y="486">workflows</text>
  <rect class="node" x="76" y="508" width="140" height="48"/>
  <text class="node-title" x="92" y="529">P5</text><text class="node-text" x="92" y="546">persona &amp; comms</text>
  <rect class="node" x="230" y="508" width="140" height="48"/>
  <text class="node-title" x="246" y="529">P6</text><text class="node-text" x="246" y="546">goals &amp; direction</text>
  <text class="legend-strong" x="76" y="604">P0 is the only absolute invariant.</text>
  <text class="legend" x="76" y="628">P1–P6 are controlled-mutable</text>
  <text class="legend" x="76" y="648">responsibility layers, not a pipeline.</text>

  <rect class="plane" x="428" y="232" width="350" height="486"/>
  <text class="plane-title" x="456" y="270">Actor / Role plane</text>
  <text class="plane-subtitle" x="456" y="292">capability · I/O · permission · escalation</text>
  <rect class="node" x="456" y="324" width="294" height="66"/>
  <text class="node-title" x="474" y="349">Role manifest</text>
  <text class="node-text" x="474" y="370">capabilities and declared inputs/outputs</text>
  <rect class="node" x="456" y="410" width="294" height="66"/>
  <text class="node-title" x="474" y="435">Permission boundary</text>
  <text class="node-text" x="474" y="456">allowed actions and state scope</text>
  <rect class="node" x="456" y="496" width="294" height="66"/>
  <text class="node-title" x="474" y="521">Escalation contract</text>
  <text class="node-text" x="474" y="542">review, refusal, and handoff paths</text>
  <text class="legend" x="456" y="614">A role does not gain Brain authority</text>
  <text class="legend" x="456" y="635">because it runs first or last.</text>

  <rect class="plane" x="808" y="232" width="424" height="486"/>
  <text class="plane-title" x="836" y="270">Compilation plane</text>
  <text class="plane-subtitle" x="836" y="292">explicit dependency DAG · explicit compileOrder</text>

  <rect class="node" x="836" y="324" width="142" height="54"/>
  <text class="node-title" x="852" y="347">P0 constraints</text><text class="node-text" x="852" y="365">declared inputs</text>
  <rect class="node" x="1050" y="324" width="142" height="54"/>
  <text class="node-title" x="1066" y="347">Role inputs</text><text class="node-text" x="1066" y="365">declared capabilities</text>
  <rect class="node" x="922" y="430" width="228" height="62"/>
  <text class="node-title" x="944" y="456">Dependency DAG</text>
  <text class="node-text" x="944" y="476">topological compileOrder</text>
  <rect class="node" x="922" y="548" width="228" height="62"/>
  <text class="node-title" x="944" y="574">Compiled artifacts</text>
  <text class="node-text" x="944" y="594">stable, deterministic bundles</text>
  <path class="dag" d="M 907 378 L 965 430"/>
  <path class="dag" d="M 1121 378 L 1090 430"/>
  <path class="dag" d="M 1036 492 L 1036 548"/>
  <text class="legend-strong" x="836" y="654">P numbers do not define compile order.</text>
  <text class="legend" x="836" y="676">Only declared dependencies and a valid</text>
  <text class="legend" x="836" y="696">topological order determine compilation.</text>

  <line x1="48" y1="754" x2="1232" y2="754" stroke="#cbd5e1"/>
  <text class="legend" x="48" y="784">Separation rule: Brain defines responsibility · Actor/Role defines capability · Compilation defines transformation order.</text>
</svg>
