apiVersion: brain-role.dev/v1alpha2
kind: NeuronManifest
metadata:
  id: sensory
  version: 0.2.0
  classification: PUBLIC
spec:
  layer: cerebral-cortex
  roleRef: synthetic-observer
  capabilityRef: architecture.read
  inputPorts:
  - name: request
    signalType: task.request/v1
  - name: feedback
    signalType: task.approved/v1
  outputPorts:
  - name: signalOut
    signalType: task.request/v1
  integration:
    strategy: any
    activationThreshold: 1.0
