apiVersion: brain-role.dev/v1alpha2
kind: RoleManifest
metadata:
  id: synthetic-observer
  version: 0.1.0
  classification: PUBLIC
spec:
  purpose: Inspect a synthetic public architecture without mutation.
  owner: synthetic-architecture-maintainers
  inputs: [validated-instance]
  outputs: [conformance-summary]
  capabilities: [architecture.read]
  networkPolicy: deny
  readLayers: [brainstem, cerebellum, hippocampus, amygdala, cerebral-cortex, default-mode-network, prefrontal-cortex]
  writeLayers: []
  forbiddenLayers: [brainstem]
  stateScope: none
  escalation: maintainer-review
  failureMode: stop
  fallbackPolicy: remain read-only
  selfEscalation: false
