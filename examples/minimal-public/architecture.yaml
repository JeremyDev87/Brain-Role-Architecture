apiVersion: brain-role.dev/v1alpha2
kind: BrainArchitecture
metadata:
  id: minimal-public
  architectureId: bra-minimal-public
  version: 0.1.0
  classification: PUBLIC
layers:
  - layers/brainstem.yaml
  - layers/cerebellum.yaml
  - layers/hippocampus.yaml
  - layers/amygdala.yaml
  - layers/cerebral-cortex.yaml
