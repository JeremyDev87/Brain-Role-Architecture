apiVersion: brain-role.dev/v1alpha2
kind: RoleManifest
metadata:
  id: synthetic-operator
  version: 0.1.0
  classification: PUBLIC
spec:
  purpose: Execute bounded synthetic workflows under brainstem constraints.
  owner: synthetic-architecture-maintainers
  inputs: [approved-goal, validated-state]
  outputs: [provenanced-result]
  capabilities: [state.propose, workflow.execute]
  networkPolicy: deny
  readLayers: [brainstem, hippocampus, cerebral-cortex, prefrontal-cortex]
  writeLayers: [hippocampus, cerebral-cortex, prefrontal-cortex]
  forbiddenLayers: [brainstem, cerebellum, amygdala, default-mode-network]
  stateScope: task
  escalation: maintainer-review
  failureMode: stop
  fallbackPolicy: stop without mutation
  selfEscalation: false
